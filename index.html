function openAjusteModal(p, dir){
  if(!esAdminActual()){ showToast('Solo un admin puede ajustar el stock.', 'error'); return; }
  openModal(`
    <div class="spread"><h3>Ajustar stock</h3><button class="btn btn-icon btn-ghost" id="m-close" aria-label="Cerrar">${ICONS.close}</button></div>
    <div class="sub">${escapeHtml(p.nombre)}${p.variante? ' · '+escapeHtml(p.variante):''} · stock actual: <b>${stockDe(p)}</b></div>
    <label class="field">Tipo de movimiento</label>
    <select class="input" id="a-tipo">
      <option value="entrada" ${dir>0?'selected':''}>Entrada (compra / reposición)</option>
      <option value="salida" ${dir<0?'selected':''}>Salida</option>
      <option value="merma">Merma / pérdida</option>
      <option value="ajuste">Ajuste de conteo</option>
    </select>
    <label class="field">Cantidad</label>
    <div class="qty-adj">
      <button id="a-menos" type="button">−</button>
      <input class="input" id="a-cant" type="number" inputmode="numeric" style="text-align:center;" value="1" min="1"/>
      <button id="a-mas" type="button">+</button>
    </div>
    <label class="field">Costo unitario (solo si estás agregando stock)</label>
    <input class="input" id="a-costo" type="number" inputmode="numeric" value="0"/>
    <label class="field">Motivo (opcional)</label>
    <input class="input" id="a-motivo" placeholder="Ej: pedido a proveedor #12"/>
    <hr class="hairline"/>
    <button class="btn btn-primary btn-block" id="a-guardar">Confirmar</button>
  `);
  $('#m-close').addEventListener('click', closeModal);
  $('#a-menos').addEventListener('click', ()=>{ const i=$('#a-cant'); i.value = Math.max(1, Number(i.value)-1); });
  $('#a-mas').addEventListener('click', ()=>{ const i=$('#a-cant'); i.value = Number(i.value)+1; });
  $('#a-guardar').addEventListener('click', async ()=>{
    const tipo = $('#a-tipo').value;
    const cant = Math.max(1, Number($('#a-cant').value)||1);
    const signo = (tipo==='entrada') ? 1 : (tipo==='ajuste' ? (dir>=0?1:-1) : -1);
    const motivo = $('#a-motivo').value.trim();
    if(signo < 0){
      // una salida consume lotes FIFO: la registra el servidor, con el mismo bloqueo que las ventas
      const btn = $('#a-guardar');
      if(btn){ btn.disabled = true; btn.textContent = 'Guardando...'; }
      const r = await registrarSalidaServidor({ id:uid(), productoId:p.id, tipo, cantidad:cant, motivo, operador, fecha:Date.now() });
      if(!r.ok){
        if(btn){ btn.disabled = false; btn.textContent = 'Confirmar'; }
        showToast(r.mensaje || 'No se pudo registrar la salida.', 'error');
        return;
      }
      closeModal(); render();
      showToast('Stock actualizado: ' + stockDe(productos.find(x=>x.id===p.id)) + ' unidades.');
      return;
    }
    // una entrada suma un lote nuevo; sumar una diferencia es compatible con lo que haga el servidor
    const costo = Number($('#a-costo').value)||0;
    p.stock = Number(p.stock||0) + cant;
    lotes.push({id:uid(), productoId:p.id, cantidadInicial:cant, cantidadRestante:cant, costoUnitario:costo, fecha:Date.now()});
    saveLotes();
    movimientos.push({id:uid(), productoId:p.id, tipo, cantidad:cant, motivo, operador, fecha:Date.now(), costoTotal:cant*costo});
    saveProductos(); saveMovimientos(); closeModal(); render();
    showToast('Stock actualizado: ' + stockDe(p) + ' unidades.');
  });
}

function openScanModal(target){

  `);
  $('#m-close').addEventListener('click', closeModal);
  $('#scan-manual-btn').addEventListener('click', ()=>{

function startScan(){
  if(!window.Html5Qrcode){
    const msg = $('#scan-msg'); if(msg) msg.textContent = 'El lector de códigos no cargó. Usa el código manual.';
    return;
  }
  try{
    html5QrInstance = new Html5Qrcode('reader');
    html5QrInstance.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 230, height: 230 } },
      (decodedText) => { handleScanResult(decodedText); },
      () => { /* frame sin código, se ignora */ }
    ).catch(()=>{
      const msg = $('#scan-msg'); if(msg) msg.textContent = 'No se pudo acceder a la cámara. Usa el código manual.';
    });
  }catch(e){
    const msg = $('#scan-msg'); if(msg) msg.textContent = 'No se pudo iniciar el lector. Usa el código manual.';
  }
}
function stopScan(){
  if(html5QrInstance){
    const inst = html5QrInstance;
    html5QrInstance = null;
    try{ inst.stop().then(()=>{ try{ inst.clear(); }catch(e){} }).catch(()=>{}); }catch(e){}
  }
}
function handleScanResult(code){
  stopScan();
  if(scanTarget === 'form-sku'){
    closeModal();
    const ctx = pendingFormContext || {pRef:null, draft:{}, padreId:null};
    const draft = Object.assign({}, ctx.draft, {sku: code});
    openProductoForm(ctx.pRef, draft, ctx.padreId);
    return;
  }
  const p = productos.find(x=>x.sku === code);
  if(scanTarget === 'inventario'){
    closeModal();
    filtro.texto = code;
    if(!p) showToast('No se encontró ningún producto con ese código.', 'error');
    render();
  } else if(scanTarget === 'venta'){
    closeModal();
    if(p) agregarAlCarrito(p);
    else showToast('No se encontró ningún producto con ese código.', 'error');
  }
}

function recaudacionTurno(turno){
  const r = {efectivo:0, debito:0, credito:0, transferencia:0, fiado:0, ventas:0};
  if(!turno) return r;
  ventas.filter(v=>v.fecha >= turno.fechaApertura).forEach(v=>{
    r.ventas++;
    (v.pagos||[]).forEach(pg=>{
      const m = pg.metodo;
      if(r[m] != null) r[m] += Number(pg.monto||0);
    });
  });
  return r;
}

/* Menú de toque rápido: antes listaba TODOS los productos con stock (una grilla larga que
   había que scrollear). Ahora muestra como máximo 5: los que más se han vendido según el
   historial de ventas y, si todavía no hay ventas suficientes para llenar los 5 cupos
   (negocio nuevo, o pocos productos distintos vendidos), se completa con productos al azar
   entre los que tienen stock. */
function productosMenuRapido(){
  const disponibles = productos.filter(p=>stockDe(p) > 0);
  if(!disponibles.length) return [];
  const cantidadVendida = {};
  ventas.forEach(v=>{ if(v.tipo==='abono') return; (v.items||[]).forEach(it=>{
    cantidadVendida[it.productoId] = (cantidadVendida[it.productoId]||0) + it.cantidad;
  }); });
  const masVendidos = disponibles.filter(p=>cantidadVendida[p.id]>0)
    .sort((a,b)=>cantidadVendida[b.id]-cantidadVendida[a.id])
    .slice(0,5);
  if(masVendidos.length >= 5) return masVendidos;
  const yaElegidos = new Set(masVendidos.map(p=>p.id));
  const relleno = disponibles.filter(p=>!yaElegidos.has(p.id));
  // Fisher-Yates: se baraja el relleno para que los 5 randoms por defecto (o el complemento
  // cuando faltan pocos) cambien cada vez, no siempre los primeros del catálogo.
  for(let i=relleno.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [relleno[i], relleno[j]] = [relleno[j], relleno[i]];
  }
  return masVendidos.concat(relleno.slice(0, 5-masVendidos.length));
}
function renderMenuRapido(){
  const items = productosMenuRapido();
  if(!items.length) return `<div class="empty-state"><p>No hay productos con stock disponible.</p></div>`;
  return `<div class="quick-menu">
    ${items.map(p=>`
      <button class="quick-item" data-quick="${p.id}" type="button">
        <span class="qn">${escapeHtml(p.nombre)}</span>

}

    ${requerido? `<p style="font-size:11px;color:var(--red);margin-top:4px;">Elige un cliente de la lista para registrar el fiado.</p>`:''}
  `;
}
function puedeConfirmarVenta(total){
  if(!carrito.length || total<=0) return false;
  if(pagosMixtos){
    const asignado = pagosMixtos.reduce((a,pg)=>a+(Number(pg.monto)||0),0);
    if(Math.round(asignado)!==Math.round(total)) return false;
  }
  if(pagoTieneFiado() && !clienteVentaId) return false;
  return true;
}
function renderCarrito(){
  if(!carrito.length) return '';
  const total = carrito.reduce((a,c)=>a+c.cantidad*c.precio,0);
  return `
    ${carrito.map((c,i)=>`
      <div class="cart-line">
        <div>${escapeHtml(c.nombre)}<div style="font-size:11px;color:var(--ink-soft);">${fmtCLP(c.precio)} c/u</div></div>
        <div class="qty-adj">
          <button data-cart-menos="${i}" type="button" aria-label="Quitar una unidad de ${escapeHtml(c.nombre)}">−</button>
          <span style="font-family:var(--font-mono);min-width:20px;text-align:center;">${c.cantidad}</span>
          <button data-cart-mas="${i}" type="button" aria-label="Agregar una unidad de ${escapeHtml(c.nombre)}">+</button>
          <button data-cart-del="${i}" type="button" style="border-color:var(--red);color:var(--red);" aria-label="Eliminar ${escapeHtml(c.nombre)} del carrito">✕</button>
        </div>
      </div>`).join('')}
    <div class="spread" style="padding:10px 0;font-weight:700;"><span>Total</span><span>${fmtCLP(total)}</span></div>
  `;
}
function agregarAlCarrito(p){
  if(stockDe(p) <= 0){ showToast('Ese producto no tiene stock disponible.', 'error'); return; }
  const existing = carrito.find(c=>c.productoId===p.id);
  if(existing) existing.cantidad += 1;
  else carrito.push({productoId:p.id, nombre:p.nombre, precio:p.precio, cantidad:1});
  actualizarCarritoUI();
}
function calcularTotalCarrito(){
  return carrito.reduce((a,c)=>a+c.cantidad*c.precio,0);
}
/* Actualización quirúrgica de la venta en curso: antes, cada toque en el menú rápido,
   cada +/- de cantidad, o cada cambio de forma de pago llamaba a render(), que
   reconstruye TODA la vista (topbar, menú rápido completo, historial de ventas, etc.)
   y vuelve a enganchar decenas de listeners aunque nada de eso haya cambiado.
   En una caja donde se tocan varios productos seguidos, eso se siente. Esta función
   solo repinta los bloques que realmente dependen del carrito: el propio carrito,
   la forma de pago, el cliente de la venta y la barra flotante de total. */
function actualizarCarritoUI(){
  const cajaBox = $('#carrito-box');
  if(!cajaBox){ render(); return; } // fuera de la vista de ventas: no hay nada quirúrgico que hacer
  const total = calcularTotalCarrito();
  const seccion = $('#ventas-section');
  if(seccion) seccion.style.paddingBottom = carrito.length ? '76px' : '';
  cajaBox.innerHTML = renderCarrito();
  const pagoBox = $('#forma-pago-box');
  if(pagoBox) pagoBox.innerHTML = carrito.length ? renderFormaPago(total) : '';
  const clienteBox = $('#cliente-venta-box');
  if(clienteBox){
    clienteBox.innerHTML = carrito.length ? renderClienteVenta() : '';
    clienteBox.dataset.fiado = String(pagoTieneFiado());
  }
  const stickySlot = $('#venta-sticky-slot');
  if(stickySlot) stickySlot.innerHTML = renderBarraVentaSticky(total);
  // Los listeners NO se vuelven a enganchar aquí: viven en los contenedores (delegación de
  // eventos, ver wireVentaDelegado) y sobreviven a que se reemplace su contenido.
}
/* Refresco liviano cuando solo cambian montos o métodos del pago mixto: actualiza el
   resumen, la barra de confirmar y (solo si aparece o desaparece el fiado) el bloque de
   cliente. No re-dibuja los campos, así el teclado y el foco no se pierden al pasar de
   un monto al siguiente. */
function refrescarPagoLigero(){
  const total = calcularTotalCarrito();
  const res = $('#pago-resumen');
  if(res) res.innerHTML = pagoResumenHtml(total);
  const clienteBox = $('#cliente-venta-box');
  if(clienteBox){
    const fiado = String(pagoTieneFiado());
    if(clienteBox.dataset.fiado !== fiado){
      clienteBox.dataset.fiado = fiado;
      clienteBox.innerHTML = carrito.length ? renderClienteVenta() : '';
    }
  }
  const stickySlot = $('#venta-sticky-slot');
  if(stickySlot) stickySlot.innerHTML = renderBarraVentaSticky(total);
}
/* Delegación de eventos del flujo de venta. Se instala UNA vez por contenedor (marca en
   dataset): los contenedores persisten mientras la vista de ventas está en pantalla, y lo
   que cambia es su contenido. Un clic se resuelve con closest() en el momento del evento,
   por eso se procesa exactamente una vez sin importar cuántas veces se repinte el HTML. */
function delegar(caja, tipo, manejador){
  if(!caja) return;
  const marca = 'deleg' + tipo;
  if(caja.dataset[marca]) return;
  caja.dataset[marca] = '1';
  caja.addEventListener(tipo, manejador);
}
function wireVentaDelegado(){
  // menú rápido y sugerencias de búsqueda
  delegar($('#ventas-section'), 'click', (e)=>{
    const quick = e.target.closest('[data-quick]');
    if(quick){
      const p = productos.find(x=>x.id===quick.getAttribute('data-quick'));
      if(p) agregarAlCarrito(p);
      return;
    }
    const pick = e.target.closest('#v-suggest [data-pick]');
    if(pick){
      const p = productos.find(x=>x.id===pick.getAttribute('data-pick'));
      if(p) agregarAlCarrito(p);
      const inp = $('#v-search'), sug = $('#v-suggest');
      if(inp) inp.value = '';
      if(sug) sug.innerHTML = '';
      return;
    }
    const verVenta = e.target.closest('[data-verventa]');
    if(verVenta) openVentaDetalleModal(verVenta.getAttribute('data-verventa'));
  });
  // líneas del carrito
  delegar($('#carrito-box'), 'click', (e)=>{
    const mas = e.target.closest('[data-cart-mas]');
    if(mas){
      const i = Number(mas.getAttribute('data-cart-mas'));
      if(!carrito[i]) return;
      carrito[i].cantidad++;
      actualizarCarritoUI();
      return;
    }
    const menos = e.target.closest('[data-cart-menos]');
    if(menos){
      const i = Number(menos.getAttribute('data-cart-menos'));
      if(!carrito[i]) return;
      carrito[i].cantidad--; if(carrito[i].cantidad<=0) carrito.splice(i,1);
      actualizarCarritoUI();
      return;
    }
    const del = e.target.closest('[data-cart-del]');
    if(del){
      const i = Number(del.getAttribute('data-cart-del'));
      if(carrito[i]===undefined) return;
      carrito.splice(i,1);
      actualizarCarritoUI();
    }
  });
  // forma de pago
  const pagoBox = $('#forma-pago-box');
  delegar(pagoBox, 'click', (e)=>{
    const quitar = e.target.closest('[data-pago-del]');
    if(quitar){
      if(pagosMixtos){ pagosMixtos.splice(Number(quitar.getAttribute('data-pago-del')), 1); actualizarCarritoUI(); }
      return;
    }
    if(e.target.closest('#btn-agregar-pago')){
      if(pagosMixtos){ pagosMixtos.push({metodo:'efectivo', monto:''}); actualizarCarritoUI(); }
      return;
    }
    if(e.target.closest('#btn-pago-simple')){ pagosMixtos = null; actualizarCarritoUI(); return; }
    const chip = e.target.closest('.chip[data-metodo]');
    if(chip){
      metodoPagoSimple = chip.getAttribute('data-metodo'); pagaConEfectivo = '';
      actualizarCarritoUI();
      return;
    }
    if(e.target.closest('#btn-pago-mixto')){
      pagosMixtos = [{metodo:metodoPagoSimple, monto:calcularTotalCarrito()}];
      actualizarCarritoUI();
      return;
    }
    const billete = e.target.closest('[data-billete]');
    if(billete){
      const val = billete.getAttribute('data-billete');
      pagaConEfectivo = (val === 'exacto') ? String(calcularTotalCarrito()) : val;
      actualizarVueltoUI();
    }
  });
  delegar(pagoBox, 'input', (e)=>{
    if(e.target.id === 'v-paga-con'){
      pagaConEfectivo = e.target.value;
      actualizarVueltoUI();
      return;
    }
    const monto = e.target.closest('[data-pago-monto]');
    if(monto && pagosMixtos){
      const i = Number(monto.getAttribute('data-pago-monto'));
      if(pagosMixtos[i]){ pagosMixtos[i].monto = monto.value; refrescarPagoLigero(); }
    }
  });
  delegar(pagoBox, 'change', (e)=>{
    const sel = e.target.closest('[data-pago-metodo]');
    if(sel && pagosMixtos){
      const i = Number(sel.getAttribute('data-pago-metodo'));
      if(pagosMixtos[i]){ pagosMixtos[i].metodo = sel.value; refrescarPagoLigero(); }
    }
  });
  // cliente de la venta
  const clienteBox = $('#cliente-venta-box');
  if(clienteBox){
    if(clienteBox.dataset.fiado === undefined) clienteBox.dataset.fiado = String(pagoTieneFiado());
    delegar(clienteBox, 'input', (e)=>{
      if(e.target.id === 'v-cliente') ventaCliente = e.target.value;
    });
    delegar(clienteBox, 'click', (e)=>{
      if(e.target.closest('#v-cliente-elegir')){
        openElegirClienteModal((cliente)=>{ clienteVentaId = cliente.id; ventaCliente = cliente.nombre; closeModal(); actualizarCarritoUI(); });
        return;
      }
      if(e.target.closest('#v-cliente-quitar')){ clienteVentaId = null; actualizarCarritoUI(); }
    });
  }
  // barra flotante de confirmar
  delegar($('#venta-sticky-slot'), 'click', (e)=>{
    if(e.target.closest('#v-confirmar')) pedirConfirmacionVenta();
  });
}
function wireVentas(){
  const turno = turnoAbierto();

  const inpBuscar = $('#v-search');

    box.innerHTML = matches.map(p=>`
      <div class="list-item" data-pick="${p.id}" style="cursor:pointer;">
        <div class="li-main"><div class="li-title">${escapeHtml(p.nombre)}</div><div class="li-sub">${escapeHtml(p.sku)} · stock ${stockDe(p)}</div></div>
        <div class="li-right">${fmtCLP(p.precio)}</div>
      </div>`).join('') || `<div class="empty-state"><p>Sin coincidencias.</p></div>`;

  if(btnScan) btnScan.addEventListener('click', ()=>openScanModal('venta'));
  const btnClientes = $('#btn-clientes');
  if(btnClientes) btnClientes.addEventListener('click', ()=>openClientesHub());
  wireVentaDelegado();
}

      if(vd===''||vc===''){ showToast('Ingresa también el débito y el crédito contados.', 'error'); return; }

function mostrarResultadoCierre(turno, contado, debitoContado, creditoContado){
  if(!puede('caja_cerrar')){ showToast('No tienes permiso para cerrar la caja.', 'error'); return; }
  const verArqueo = puede('ver_arqueo'); // esperado y diferencia: solo la admin
  const ventasTurno = ventas.filter(v=>v.fecha >= turno.fechaApertura);
  const retirosTurno = retiros.filter(r=>r.turnoId===turno.id);
  const totalRetiros = retirosTurno.reduce((a,r)=>a+r.monto,0);
  let efectivoVentas=0, debitoVentas=0, creditoVentas=0, transferenciaVentas=0, fiadoVentas=0;
  ventasTurno.forEach(v=>{
    (v.pagos||[]).forEach(pg=>{
      if(pg.metodo==='efectivo') efectivoVentas += Number(pg.monto||0);
      else if(pg.metodo==='debito') debitoVentas += Number(pg.monto||0);
      else if(pg.metodo==='credito') creditoVentas += Number(pg.monto||0);
      else if(pg.metodo==='transferencia') transferenciaVentas += Number(pg.monto||0);
      else if(pg.metodo==='fiado') fiadoVentas += Number(pg.monto||0);
    });
  });
  const efectivoEsperado = Number(turno.fondoInicial||0) + efectivoVentas - totalRetiros;
  const diferencia = contado - efectivoEsperado;
  const cuadrada = Math.round(diferencia)===0;
  const hayContadoDC = debitoContado!=null && creditoContado!=null;
  const diferenciaDebito = hayContadoDC ? debitoContado - debitoVentas : null;
  const diferenciaCredito = hayContadoDC ? creditoContado - creditoVentas : null;
  openModal(`
    <div class="spread"><h3>Resultado del cierre</h3><button class="btn btn-icon btn-ghost" id="m-close" aria-label="Cerrar">${ICONS.close}</button></div>
    ${verArqueo ? `
    <table class="rep-table">
      <tr><td>Fondo inicial</td><td>${fmtCLP(turno.fondoInicial)}</td></tr>
      <tr><td>+ Ventas en efectivo</td><td>${fmtCLP(efectivoVentas)}</td></tr>
      <tr><td>− Retiros / gastos</td><td>${fmtCLP(totalRetiros)}</td></tr>
      <tr><td><b>= Efectivo esperado</b></td><td><b>${fmtCLP(efectivoEsperado)}</b></td></tr>
      <tr><td>Efectivo contado</td><td>${fmtCLP(contado)}</td></tr>
      <tr><td><b>Diferencia</b></td><td style="color:${cuadrada?'var(--teal)':'var(--red)'};font-weight:700;">${cuadrada?'Cuadrada':((diferencia>0?'+':'')+fmtCLP(diferencia))}</td></tr>
    </table>
    <hr class="hairline"/>
    <h2>Ventas del turno por método</h2>
    <table class="rep-table">
      <tr><td>Efectivo</td><td>${fmtCLP(efectivoVentas)}</td></tr>
      <tr><td>Débito</td><td>${fmtCLP(debitoVentas)}</td></tr>
      <tr><td>Crédito</td><td>${fmtCLP(creditoVentas)}</td></tr>
      <tr><td>Transferencia</td><td>${fmtCLP(transferenciaVentas)}</td></tr>
      <tr><td>Fiado (no entra a caja)</td><td style="color:${fiadoVentas>0?'var(--red)':'inherit'};">${fmtCLP(fiadoVentas)}</td></tr>
      <tr><td><b>Total ventas</b></td><td><b>${fmtCLP(efectivoVentas+debitoVentas+creditoVentas+transferenciaVentas+fiadoVentas)}</b></td></tr>
    </table>
    <p style="font-size:10.5px;color:var(--ink-soft);margin-top:6px;">El fiado queda como deuda del cliente y por eso no suma al efectivo esperado. Los abonos que se cobren después sí entran en el turno en que se reciben.</p>
    ` : `
    <p class="sub">Esto es lo que contaste. La admin compara estos números con el sistema al revisar el turno.</p>
    <table class="rep-table">
      <tr><td>Efectivo contado y entregado</td><td><b>${fmtCLP(contado)}</b></td></tr>
      <tr><td>Débito contado</td><td><b>${fmtCLP(debitoContado)}</b></td></tr>
      <tr><td>Crédito contado</td><td><b>${fmtCLP(creditoContado)}</b></td></tr>
      <tr><td>Ventas registradas</td><td>${ventasTurno.length}</td></tr>
    </table>
    `}
    <hr class="hairline"/>
    <button class="btn btn-primary btn-block" id="cc-confirmar" type="button">Confirmar y cerrar turno</button>
  `);
  $('#m-close').addEventListener('click', closeModal);
  $('#cc-confirmar').addEventListener('click', ()=>{
    turno.estado = 'cerrado';
    turno.fechaCierre = Date.now();
    turno.operadorCierre = operador;
    turno.efectivoContado = contado;
    turno.efectivoEsperado = efectivoEsperado;
    turno.diferencia = diferencia;
    if(hayContadoDC){
      turno.debitoContado = debitoContado;
      turno.creditoContado = creditoContado;
      turno.diferenciaDebito = diferenciaDebito;
      turno.diferenciaCredito = diferenciaCredito;
    }
    turno.resumenPagos = {efectivo:efectivoVentas, debito:debitoVentas, credito:creditoVentas, transferencia:transferenciaVentas, fiado:fiadoVentas};
    saveTurnos();
    carrito = []; pagosMixtos = null; metodoPagoSimple = 'efectivo'; clienteVentaId = null; pagaConEfectivo = '';
    closeModal(); render();
    if(verArqueo) showToast(cuadrada? 'Turno cerrado. Caja cuadrada.' : 'Turno cerrado. Diferencia: '+fmtCLP(diferencia));
    else showToast('Turno cerrado. Quedó registrado lo recaudado.');
  });
}
let confirmandoVenta = false;
/* ---------------- VENTAS: COLA E IDEMPOTENCIA ----------------
   Cada venta se registra en el servidor con UNA llamada a registrar_venta, que en una sola
   transacción guarda la venta y sus movimientos, descuenta el stock, consume los lotes FIFO
   y suma el fiado (supabase/migrations/…_registrar_venta.sql).

   Antes de llamarla, la venta se guarda en una cola en este dispositivo. Si la respuesta no
   llega (señal lenta, timeout, sin internet) NO se asume que falló: la venta queda en la
   cola y se reintenta con el MISMO id. Si el servidor ya la tenía, devuelve lo que registró
   sin aplicarla de nuevo, así una venta nunca descuenta el stock dos veces.

   Mientras una venta espera en la cola, el stock que se muestra la descuenta (stockDe), pero
   `p.stock` sigue siendo el valor confirmado por el servidor y ese descuento nunca se sube
   por la sincronización: el stock de una venta tiene un solo escritor, registrar_venta. */
const TIMEOUT_VENTA_MS = 10000;
let colaVentas = [];             // [{ venta, offline }]
const ventasEnVuelo = new Set(); // ids que se están enviando en este momento
let procesandoCola = false;

function guardarCola(){ escribirJSONLocal('cola_ventas', colaVentas); actualizarIndicadorSync(); }
function cargarCola(){
  colaVentas = (leerJSONLocal('cola_ventas', []) || []).filter(e=>e && e.venta && e.venta.id);
  // si la app se cerró a mitad de un envío no sabemos si llegó: se trata como venta sin confirmar
  colaVentas.forEach(e=>{ e.offline = true; });
  guardarCola();
}
function quitarDeCola(id){
  const antes = colaVentas.length;
  colaVentas = colaVentas.filter(e=>e.venta.id !== id);
  if(colaVentas.length !== antes) guardarCola();
}
function cantidadEnCola(productoId){
  let n = 0;
  colaVentas.forEach(e=>(e.venta.items||[]).forEach(it=>{ if(it.productoId===productoId) n += Number(it.cantidad||0); }));
  return n;
}
// stock que se muestra: el confirmado por el servidor menos lo vendido que aún espera en la cola
function stockDe(p){ return p ? Number(p.stock||0) - cantidadEnCola(p.id) : 0; }

// Copia de lo que devolvió el servidor, fusionada con los cambios locales que aún no se suben.
function incorporarRemoto(key, remoto){
  aplicarFusion(key, fusionar(key, remoto, ARRAYS[key]()));
  snapshotDesde(key, remoto);
  if(pendientes[key]) escribirJSONLocal('base:'+key, remoto);
  guardarEspejo(key, ARRAYS[key](), !!pendientes[key]);
}
async function refrescarClave(key){
  if(!db) return;
  try{
    const { data, error } = await db.from('app_data').select('value').eq('key', key).maybeSingle();
    if(!error && data && Array.isArray(data.value)){ incorporarRemoto(key, data.value); render(); }
  }catch(e){}
}

/* Envía una venta. Devuelve { estado, data }:
   · 'ok': el servidor la registró (ahora o en un intento anterior).
   · 'rechazada': el servidor respondió que NO la registró (sin stock, datos inválidos...).
   · 'incierta': no sabemos qué pasó (timeout, red, sin sesión). Se reintenta con el mismo id. */
async function enviarVentaServidor(entrada){
  if(!db || dbEstado!=='ok' || !(await usuarioSesionNube())) return { estado:'incierta', motivo:'sin_conexion' };
  try{
    const llamada = db.rpc('registrar_venta', { p_venta: entrada.venta, p_offline: !!entrada.offline });
    const expira = new Promise(res=>setTimeout(()=>res({ expiro:true }), TIMEOUT_VENTA_MS));
    const r = await Promise.race([llamada, expira]);
    if(r.expiro) return { estado:'incierta', motivo:'timeout' };
    if(r.error){ console.warn('registrar_venta:', describirError(r.error)); return { estado:'incierta', motivo:'error' }; }
    const d = r.data || {};
    if(d.ok) return { estado:'ok', data:d };
    if(d.motivo==='limite_excedido' || d.motivo==='sin_sesion') return { estado:'incierta', motivo:d.motivo };
    return { estado:'rechazada', data:d };
  }catch(e){ return { estado:'incierta', motivo:'red' }; }
}

// Incorpora a este dispositivo lo que devolvió el servidor para una venta confirmada.
function aplicarVentaConfirmada(d){
  const v = d.venta;
  quitarDeCola(v.id);
  const i = ventas.findIndex(x=>x.id===v.id);
  if(i >= 0) ventas[i] = v; else ventas.push(v);
  idsVentasSincronizadas.add(v.id);
  (d.movimientos||[]).forEach(m=>{
    if(!movimientos.some(x=>x.id===m.id)) movimientos.push(m);
    idsMovimientosSincronizados.add(m.id);
  });
  guardarEspejo('ventas', ventas, !!pendientes.ventas);
  guardarEspejo('movimientos', movimientos, !!pendientes.movimientos);
  if(Array.isArray(d.productos)) incorporarRemoto('productos', d.productos);
  if(Array.isArray(d.lotes)) incorporarRemoto('lotes', d.lotes);
  if(Array.isArray(d.clientes)) incorporarRemoto('clientes', d.clientes);
}
function quitarVentaLocal(id){
  quitarDeCola(id);
  const i = ventas.findIndex(v=>v.id===id);
  if(i >= 0) ventas.splice(i, 1);
  guardarEspejo('ventas', ventas, !!pendientes.ventas);
}
// Copia local de una venta que espera confirmación (para la caja y los listados). El costo
// es una estimación con el mismo FIFO; el definitivo lo calcula el servidor.
function ventaPendienteLocal(venta){
  const items = venta.items.map(it=>{
    const prod = productos.find(x=>x.id===it.productoId);
    return Object.assign({}, it, { costoTotal: consumirFIFO(it.productoId, it.cantidad, prod?prod.precio:it.precioUnitario, true) });
  });
  const costoTotal = items.reduce((a,it)=>a+it.costoTotal,0);
  return Object.assign({}, venta, { items, costoTotal, utilidad: venta.total - costoTotal, _pendiente:true });
}

// Reintenta, en orden, las ventas que esperan confirmación.
async function procesarColaVentas(){
  if(procesandoCola || !colaVentas.length) return 0;
  procesandoCola = true;
  let confirmadas = 0, conRevision = 0;
  try{
    for(const entrada of colaVentas.slice()){
      if(ventasEnVuelo.has(entrada.venta.id)) continue;
      // si llegó a la cola, la venta ya se le entregó al cliente: se acepta aunque falte stock
      entrada.offline = true;
      ventasEnVuelo.add(entrada.venta.id);
      let r;
      try{ r = await enviarVentaServidor(entrada); } finally { ventasEnVuelo.delete(entrada.venta.id); }
      if(r.estado==='ok'){
        aplicarVentaConfirmada(r.data); confirmadas++;
        if(r.data.venta && r.data.venta.revision) conRevision++;
      } else if(r.estado==='rechazada'){
        quitarVentaLocal(entrada.venta.id);
        showToast('Una venta guardada sin conexión fue rechazada: ' + (r.data.mensaje || r.data.motivo || 'motivo desconocido') + '.', 'error');
      } else {
        break; // sin red o sin sesión: se reintenta más tarde, en el mismo orden
      }
    }
  } finally { procesandoCola = false; }
  if(confirmadas) render();
  if(conRevision) showToast(conRevision + (conRevision===1 ? ' venta hecha' : ' ventas hechas') + ' sin conexión dejaron stock negativo. Revisa el inventario.', 'error');
  return confirmadas;
}

/* Merma o ajuste de salida: consume lotes FIFO, así que también lo hace el servidor, con el
   mismo bloqueo que las ventas. Idempotente por el id del movimiento. */
async function registrarSalidaServidor(mov){
  if(!db || dbEstado!=='ok' || !(await usuarioSesionNube())) return { ok:false, mensaje:'Necesitas conexión a internet para registrar una salida de stock.' };
  for(let intento=0; intento<3; intento++){
    try{
      const expira = new Promise(res=>setTimeout(()=>res({ expiro:true }), TIMEOUT_VENTA_MS));
      const r = await Promise.race([db.rpc('registrar_salida_stock', { p_mov: mov }), expira]);
      if(r.expiro || r.error) continue; // mismo id: si ya se registró, el servidor no lo repite
      const d = r.data || {};
      if(!d.ok) return { ok:false, mensaje: d.mensaje };
      if(!movimientos.some(x=>x.id===d.movimiento.id)) movimientos.push(d.movimiento);
      idsMovimientosSincronizados.add(d.movimiento.id);
      guardarEspejo('movimientos', movimientos, !!pendientes.movimientos);
      incorporarRemoto('productos', d.productos);
      incorporarRemoto('lotes', d.lotes);
      return { ok:true };
    }catch(e){}
  }
  return { ok:false, mensaje:'No hubo respuesta del servidor. Revisa el stock antes de volver a intentar.' };
}
/* Segunda confirmación antes de procesar la venta: un clic accidental o una mala
   manipulación del equipo (por ejemplo, un roce de pantalla) ya no basta para
   registrar una venta — hay que revisar el resumen (productos, total, forma de
   pago y vuelto si es en efectivo) y tocar "Sí, confirmar venta" a propósito. */
function pedirConfirmacionVenta(){
  if(confirmandoVenta) return;
  const turno = turnoAbierto();
  if(!turno){ showToast('Abre la caja antes de vender.', 'error'); return; }
  const total = carrito.reduce((a,c)=>a+c.cantidad*c.precio,0);
  if(!puedeConfirmarVenta(total)){ showToast('Revisa los montos de la forma de pago.', 'error'); return; }
  const metodosUsados = pagosMixtos ? pagosMixtos.map(pg=>pg.metodo) : [metodoPagoSimple];
  if(metodosUsados.some(m=>!metodoPermitido(m))){
    showToast('Ese medio de pago no está habilitado para tu usuario.', 'error');
    return;
  }
  abrirResumenConfirmacionVenta(total);
}
function abrirResumenConfirmacionVenta(total){
  const filasCarrito = carrito.map(c=>`
    <div class="spread" style="padding:5px 0;font-size:13.5px;">
      <span>${escapeHtml(c.nombre)} × ${c.cantidad}</span>
      <span style="font-family:var(--font-mono);">${fmtCLP(c.cantidad*c.precio)}</span>
    </div>`).join('');

  let pagoHtml;
  if(pagosMixtos){
    pagoHtml = pagosMixtos.filter(pg=>Number(pg.monto)>0).map(pg=>`
      <div class="spread" style="font-size:13px;padding:2px 0;"><span>${metodoLabel(pg.metodo)}</span><span>${fmtCLP(Number(pg.monto)||0)}</span></div>
    `).join('');
  } else {
    pagoHtml = `<div class="spread" style="font-size:13px;padding:2px 0;"><span>${metodoLabel(metodoPagoSimple)}</span><span>${fmtCLP(total)}</span></div>`;
    if(metodoPagoSimple === 'efectivo'){
      const paga = Number(pagaConEfectivo);
      const hayMonto = pagaConEfectivo !== '' && !isNaN(paga);
      if(hayMonto){
        const vuelto = paga - total;
        pagoHtml += `<div class="spread" style="font-size:13px;padding:2px 0;color:var(--ink-soft);"><span>Paga con</span><span>${fmtCLP(paga)}</span></div>`;
        pagoHtml += `<div class="spread" style="font-size:16px;font-weight:800;padding:6px 0 0;color:${vuelto<0?'var(--red)':'var(--teal)'};"><span>${vuelto<0?'Falta':'Vuelto a entregar'}</span><span>${fmtCLP(Math.abs(vuelto))}</span></div>`;
      } else {
        pagoHtml += `<div style="font-size:12px;color:var(--red);padding-top:4px;">No indicaste con cuánto paga el cliente.</div>`;
      }
    }
  }

  openModal(`
    <div class="spread"><h3>Confirmar venta</h3><button class="btn btn-icon btn-ghost" id="m-close" aria-label="Cerrar">${ICONS.close}</button></div>
    <p class="sub">Revisa antes de confirmar — una vez registrada, la venta no se puede deshacer desde aquí.</p>
    <div style="border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding:4px 0;margin:10px 0;">${filasCarrito}</div>
    <div class="spread" style="font-weight:800;font-size:17px;padding:2px 0 12px;"><span>Total</span><span>${fmtCLP(total)}</span></div>
    <div style="background:var(--paper-dim);border-radius:10px;padding:10px 12px;margin-bottom:16px;">${pagoHtml}</div>
    <div class="row">
      <button class="btn btn-ghost btn-block" id="vc-cancelar" type="button">Cancelar</button>
      <button class="btn btn-primary btn-block" id="vc-confirmar" type="button">Sí, confirmar venta</button>
    </div>
  `);
  $('#vc-cancelar').addEventListener('click', closeModal);
  $('#vc-confirmar').addEventListener('click', ()=>{
    const btn = $('#vc-confirmar');
    if(btn){ btn.disabled = true; btn.textContent = 'Procesando...'; }
    confirmarVenta();
  });
}
async function confirmarVenta(){
  if(confirmandoVenta) return; // evita doble clic mientras se valida
  const turno = turnoAbierto();
  if(!turno){ closeModal(); showToast('Abre la caja antes de vender.', 'error'); return; }
  const total = carrito.reduce((a,c)=>a+c.cantidad*c.precio,0);
  if(!puedeConfirmarVenta(total)){ closeModal(); showToast('Revisa los montos de la forma de pago.', 'error'); return; }
  const metodosUsados = pagosMixtos ? pagosMixtos.map(pg=>pg.metodo) : [metodoPagoSimple];
  if(metodosUsados.some(m=>!metodoPermitido(m))){
    closeModal();
    showToast('Ese medio de pago no está habilitado para tu usuario.', 'error');
    return;
  }
  /* El bloqueo se mantiene hasta que la venta quedó completa (incluida la subida de lotes y
     stock), no solo mientras se valida: así no puede entrar una segunda venta a mitad. */
  confirmandoVenta = true;
  try{
    await procesarVenta(total);
  }catch(e){
    console.error('Error al registrar la venta', e);
    closeModal();
    showToast('Ocurrió un error al registrar la venta. Revisa el stock y el historial antes de reintentar.', 'error');
    render();
  }finally{
    confirmandoVenta = false;
  }
}
async function procesarVenta(total){
  const btnConfirmar = $('#vc-confirmar') || $('#v-confirmar');
  if(btnConfirmar){ btnConfirmar.disabled = true; btnConfirmar.textContent = 'Registrando...'; }

  let pagos;
  if(pagosMixtos){
    pagos = pagosMixtos.map(pg=>({metodo:pg.metodo, monto:Number(pg.monto)||0})).filter(pg=>pg.monto>0);
  } else {
    pagos = [{metodo: metodoPagoSimple, monto: total}];
  }
  const metodoResumen = pagos.length>1 ? 'mixto' : pagos[0].metodo;
  const venta = {
    id: uid(), tipo:'venta', fecha: Date.now(),
    items: carrito.map(c=>({ productoId:c.productoId, nombre:c.nombre, cantidad:c.cantidad, precioUnitario:c.precio })),
    total, cliente: ventaCliente.trim(), clienteId: clienteVentaId, operador, pagos, metodoResumen
  };

  // 1) A la cola ANTES de llamar al servidor: si la app se cierra a mitad, la venta no se pierde.
  const entrada = { venta, offline:false };
  ventasEnVuelo.add(venta.id);
  colaVentas.push(entrada); guardarCola();
  let r;
  try{ r = await enviarVentaServidor(entrada); } finally { ventasEnVuelo.delete(venta.id); }

  if(r.estado==='rechazada'){
    // el servidor respondió que no la registró: no pasó nada y el carrito sigue igual
    quitarDeCola(venta.id);
    closeModal();
    const d = r.data || {};
    if(d.motivo==='stock_insuficiente'){
      const detalle = (d.faltantes||[]).map(f=>{
        const p = productos.find(x=>x.id===f.productoId);
        return p ? p.nombre : f.productoId;
      }).join(', ');
      showToast(`No hay stock suficiente de: ${detalle||'uno de los productos'}. Ajusta el carrito.`, 'error');
      refrescarClave('productos');
    } else {
      showToast(d.mensaje || 'No se pudo registrar la venta.', 'error');
    }
    render();
    return;
  }

  if(r.estado==='ok'){
    aplicarVentaConfirmada(r.data);
  } else {
    // 2) Sin respuesta: NO se asume que falló. Queda en la cola y se reintenta con el mismo id;
    //    si el servidor ya la había registrado, no la aplica dos veces.
    entrada.offline = true; guardarCola();
    if(!ventas.some(v=>v.id===venta.id)) ventas.push(ventaPendienteLocal(venta));
    guardarEspejo('ventas', ventas, !!pendientes.ventas);
    setTimeout(()=>{ procesarColaVentas(); }, 5000);
  }

  carrito = []; ventaCliente = ''; pagosMixtos = null; metodoPagoSimple = 'efectivo'; clienteVentaId = null; pagaConEfectivo = '';
  closeModal();
  render();
  showToast(r.estado==='ok'
    ? 'Venta registrada: ' + fmtCLP(total)
    : 'Venta guardada en este dispositivo: ' + fmtCLP(total) + '. Se confirma con la nube apenas haya señal.');
}

function elegirClienteListaHtml(filtroTexto){
  const t = (filtroTexto||'').trim().toLowerCase();
  const lista = clientes.filter(c=>!t || (c.nombre||'').toLowerCase().includes(t)).slice(0,20);
  if(!lista.length) return `<div class="empty-state"><p>Sin coincidencias. Puedes crear un cliente nuevo.</p></div>`;
  return lista.map(c=>`
    <div class="list-item" data-elegir="${c.id}" style="cursor:pointer;">

    </div>`).join('');

function wireElegirClienteLista(onPick){

function openClienteFormParaElegir(nombreSugerido, onPick){

function wireProveedores(){
  $('#btn-nuevo-proveedor').addEventListener('click', ()=>openProveedorForm());
  $$('[data-editpr]').forEach(b=>b.addEventListener('click', ()=>{
    const pr = proveedores.find(x=>x.id===b.getAttribute('data-editpr'));
    openProveedorForm(pr);
  }));
  $$('[data-pedido]').forEach(b=>b.addEventListener('click', ()=>{

}
function generarPedido(pr){
  const items = productos.filter(p=>p.proveedorId===pr.id && bajoStock(p));
  openPedidoModal(pr, items);
}
function openPedidoModal(pr, items){
  const rows = items.map(p=>{
    const ideal = Number(p.stockIdeal||0) || Number(p.stockMinimo||0)*2;
    const pedir = Math.max(1, Math.round(ideal - stockDe(p)));
    const padre = p.padreId ? productosPadre.find(x=>x.id===p.padreId) : null;
    const nombre = padre ? `${padre.nombre} (${p.variante||'—'})` : p.nombre;
    return { sku:p.sku, nombre, stock:stockDe(p), stockMinimo:Number(p.stockMinimo||0), ideal, pedir };
  });
  const totalUnidades = rows.reduce((a,r)=>a+r.pedir,0);
  openModal(`
    <div class="spread"><h3>Pedido a ${escapeHtml(pr.nombre)}</h3><button class="btn btn-icon btn-ghost" id="m-close" aria-label="Cerrar">${ICONS.close}</button></div>
    ${rows.length ? `
      <table class="rep-table" style="margin-top:6px;">
        <tr><th>Producto</th><th>Stock</th><th>Pedir</th></tr>
        ${rows.map(r=>`<tr><td>${escapeHtml(r.nombre)}<div style="font-size:9.5px;color:var(--ink-soft);">${escapeHtml(r.sku)}</div></td><td>${r.stock}</td><td style="font-weight:700;">${r.pedir}</td></tr>`).join('')}
      </table>
      <p style="font-size:11.5px;color:var(--ink-soft);margin-top:8px;">${rows.length} producto(s) · ${totalUnidades} unidades en total. La cantidad a pedir busca llegar al stock ideal (o al doble del mínimo si no lo definiste).</p>
      <div class="row" style="margin-top:14px;">
        <button class="btn btn-block" id="ped-csv" type="button">Descargar CSV</button>
        <button class="btn btn-block" id="ped-print" type="button">Imprimir / PDF</button>
      </div>
      <button class="btn btn-teal btn-block" id="ped-copy" type="button" style="margin-top:8px;">Copiar texto para enviar</button>
    ` : `<div class="empty-state"><p>Ningún producto de este proveedor está bajo su stock mínimo ahora mismo.</p></div>`}
  `);
  $('#m-close').addEventListener('click', closeModal);
  if(rows.length){
    $('#ped-csv').addEventListener('click', ()=>exportCSV('pedido-'+pr.nombre.replace(/\s+/g,'-')+'.csv', rows, ['sku','nombre','stock','stockMinimo','ideal','pedir']));
    $('#ped-print').addEventListener('click', ()=>imprimirPedido(pr, rows, totalUnidades));
    $('#ped-copy').addEventListener('click', ()=>{
      const texto = 'Pedido para ' + pr.nombre + '\n' + rows.map(r=>'• '+r.nombre+' ('+r.sku+') x'+r.pedir).join('\n') + '\n\nTotal: '+totalUnidades+' unidades';
      if(navigator.clipboard && navigator.clipboard.writeText){
        navigator.clipboard.writeText(texto).then(()=>showToast('Copiado al portapapeles.')).catch(()=>showToast('No se pudo copiar. Intenta de nuevo.', 'error'));
      } else {
        showToast('Tu navegador no permite copiar automáticamente.', 'error');
      }
    });
  }
}
function imprimirPedido(pr, rows, total){
  const area = document.getElementById('print-area');
  if(!area) return;
  area.innerHTML = `
    <h2>Orden de pedido — ${escapeHtml(pr.nombre)}</h2>
    <p>Fecha: ${new Date().toLocaleDateString('es-CL')}</p>
    <table>
      <tr><th>SKU</th><th>Producto</th><th>Stock actual</th><th>Cantidad a pedir</th></tr>
      ${rows.map(r=>`<tr><td>${escapeHtml(r.sku)}</td><td>${escapeHtml(r.nombre)}</td><td>${r.stock}</td><td>${r.pedir}</td></tr>`).join('')}
    </table>
    <p style="margin-top:14px;"><b>Total a pedir: ${total} unidades</b></p>
  `;
  window.print();
}

      productos.forEach(p=>{ if(p.proveedorId===pr.id) p.proveedorId=null; });
      saveProveedores(); saveProductos(); closeModal(); render();
      showToast('Proveedor eliminado.');
    });

  $('#pr-guardar').addEventListener('click', ()=>{
    const nombre = $('#pr-nombre').value.trim();

    else proveedores.push(Object.assign({id:uid()}, data));

/* ---------------- REPORTES ---------------- */
let chartInstances = [];
function renderReportes(){
  if(!esAdminActual()){
    return `<div class="section"><div class="empty-state"><p>Esta sección es solo para admins.</p></div></div>`;
  }
  const movs = movimientos.slice().reverse().slice(0,25);
  const ventasReales = ventas.filter(v=>v.tipo!=='abono');
  const ingresosTotal = ventasReales.reduce((a,v)=>a+v.total,0);
  const costoTotal = ventasReales.reduce((a,v)=>a+Number(v.costoTotal||0),0);
  const utilidadTotal = ingresosTotal - costoTotal;
  const margen = ingresosTotal ? (utilidadTotal/ingresosTotal*100) : 0;
  const hace30 = Date.now() - 30*24*60*60*1000;
  const ventas30 = ventasReales.filter(v=>v.fecha>=hace30);
  const utilidad30 = ventas30.reduce((a,v)=>a+v.total,0) - ventas30.reduce((a,v)=>a+Number(v.costoTotal||0),0);
  return `
  <div class="section">
    <h2>Rentabilidad</h2>
    <div class="kpi-grid">
      <div class="kpi"><div class="num">${fmtCLP(ingresosTotal)}</div><div class="label">ingresos totales</div></div>
      <div class="kpi"><div class="num">${fmtCLP(costoTotal)}</div><div class="label">costo de venta (FIFO)</div></div>
      <div class="kpi"><div class="num">${fmtCLP(utilidadTotal)}</div><div class="label">utilidad bruta</div></div>
      <div class="kpi"><div class="num">${margen.toFixed(1)}%</div><div class="label">margen bruto</div></div>
      <div class="kpi"><div class="num">${fmtCLP(utilidad30)}</div><div class="label">utilidad, 30 días</div></div>
      <div class="kpi"><div class="num">${ventas30.length}</div><div class="label">ventas, 30 días</div></div>
    </div>
    <p style="font-size:10.5px;color:var(--ink-soft);">El costo se calcula descontando primero las unidades del lote de compra más antiguo de cada producto (FIFO). Las ventas de productos sin lotes registrados usan el precio de venta como estimación de costo.</p>
    <hr class="hairline"/>
    <div class="chart-box"><h4>Ventas de los últimos 14 días</h4><canvas id="chart-ventas" height="160"></canvas></div>
    <div class="chart-box"><h4>Productos más vendidos</h4><canvas id="chart-top" height="160"></canvas></div>
    <div class="chart-box"><h4>Valor de inventario por categoría (a costo)</h4><canvas id="chart-cat" height="160"></canvas></div>
    <div class="chart-box"><h4>Ventas por método de pago</h4><canvas id="chart-metodos" height="160"></canvas></div>
    <button class="btn btn-primary btn-block" id="btn-export-ventas-excel" style="margin-bottom:10px;">Exportar ventas a Excel</button>
    <div class="row" style="margin-bottom:10px;">
      <button class="btn btn-block" id="btn-export-inv">Exportar inventario (CSV)</button>
      <button class="btn btn-block" id="btn-export-mov">Exportar movimientos (CSV)</button>
    </div>
    <button class="btn btn-block" id="btn-export-clientes" style="margin-bottom:10px;">Exportar clientes / fiado (CSV)</button>
    <h2>Arqueos de caja recientes</h2>
    ${(function(){
      const cerrados = turnos.filter(t=>t.estado==='cerrado').slice().reverse().slice(0,10);
      if(!cerrados.length) return `<p style="font-size:11.5px;color:var(--ink-soft);">Todavía no se ha cerrado ningún turno.</p>`;
      const celdaDif = (dif) => dif==null ? '—' : `<span style="color:${Math.round(dif)===0?'var(--teal)':'var(--red)'};">${(dif>0?'+':'')+fmtCLP(dif)}</span>`;
      return `<table class="rep-table">
        <tr><th>Cierre</th><th>Cerró</th><th>Efvo. esperado</th><th>Efvo. contado</th><th>Dif. efvo.</th><th>Dif. débito</th><th>Dif. crédito</th></tr>
        ${cerrados.map(t=>`<tr>
          <td>${fmtDate(t.fechaCierre)}</td>
          <td>${escapeHtml(t.operadorCierre||'—')}</td>
          <td>${fmtCLP(t.efectivoEsperado)}</td>
          <td>${fmtCLP(t.efectivoContado)}</td>
          <td>${celdaDif(t.diferencia)}</td>
          <td>${t.debitoContado!=null ? celdaDif(t.diferenciaDebito) : '—'}</td>
          <td>${t.creditoContado!=null ? celdaDif(t.diferenciaCredito) : '—'}</td>
        </tr>`).join('')}
      </table>
      <p style="font-size:10.5px;color:var(--ink-soft);margin-top:4px;">"Dif. débito/crédito" compara lo que contó quien cerró el turno contra lo que el sistema registró en ventas. "—" significa que quien cerró ya veía esos totales y no necesitó contarlos aparte.</p>`;
    })()}
    <hr class="hairline"/>
    <h2>Últimos movimientos</h2>
    <table class="rep-table">
      <tr><th>Fecha</th><th>Producto</th><th>Tipo</th><th>Cant.</th><th>Quién</th></tr>
      ${movs.map(m=>{
        const p = productos.find(x=>x.id===m.productoId);
        return `<tr><td>${fmtDate(m.fecha)}</td><td>${p?escapeHtml(p.nombre):'—'}</td><td>${tipoMovLabel(m.tipo)}</td><td>${m.cantidad>0?'+':''}${m.cantidad}</td><td>${escapeHtml(m.operador||'—')}</td></tr>`;
      }).join('') || '<tr><td colspan="5" style="font-family:var(--font-sans);color:var(--ink-soft);">Sin movimientos todavía.</td></tr>'}
    </table>
  </div>`;
}
function drawReportCharts(){
  chartInstances.forEach(c=>c.destroy());
  chartInstances = [];
  if(!window.Chart){
    // el CDN de los gráficos todavía no llega: se reintenta una vez sin bloquear la app
    if(!drawReportCharts._reintento){
      drawReportCharts._reintento = true;
      setTimeout(()=>{ if(view==='reportes') drawReportCharts(); }, 2000);
    }
    return;
  }
  // ventas por dia (14 dias, sin abonos)
  const ventasReales2 = ventas.filter(v=>v.tipo!=='abono');
  const days = [];
  for(let i=13;i>=0;i--){ const d=new Date(); d.setHours(0,0,0,0); d.setDate(d.getDate()-i); days.push(d); }
  const totals = days.map(d=>{
    const next = new Date(d); next.setDate(next.getDate()+1);
    return ventasReales2.filter(v=>v.fecha>=d.getTime() && v.fecha<next.getTime()).reduce((a,v)=>a+v.total,0);
  });
  const c1 = $('#chart-ventas');
  if(c1) chartInstances.push(new Chart(c1, {
    type:'bar',
    data:{labels:days.map(d=>d.toLocaleDateString('es-CL',{day:'2-digit',month:'2-digit'})), datasets:[{data:totals, backgroundColor:'#D97E26'}]},
    options:{plugins:{legend:{display:false}}, scales:{y:{ticks:{callback:v=>fmtCLP(v)}}}}
  }));
  // top productos vendidos
  const cant = {};
  ventas.forEach(v=>v.items.forEach(it=>{ cant[it.nombre] = (cant[it.nombre]||0) + it.cantidad; }));
  const top = Object.entries(cant).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const c2 = $('#chart-top');
  if(c2) chartInstances.push(new Chart(c2, {
    type:'bar',
    data:{labels:top.map(t=>t[0]), datasets:[{data:top.map(t=>t[1]), backgroundColor:'#235943'}]},
    options:{indexAxis:'y', plugins:{legend:{display:false}}}
  }));
  // valor inventario por categoria (a costo, con respaldo al precio de venta si no hay lotes)
  const lotesMapCat = indexarLotesPorProducto();
  const porCat = {};
  productos.forEach(p=>{
    const cat = p.categoria || 'Sin categoría';
    const lotesP = lotesMapCat.get(p.id);
    const valor = (lotesP && lotesP.length) ? lotesP.reduce((a,l)=>a+Number(l.cantidadRestante||0)*Number(l.costoUnitario||0),0) : Number(p.stock||0)*Number(p.precio||0);
    porCat[cat] = (porCat[cat]||0) + valor;
  });
  const c3 = $('#chart-cat');
  const paleta = ['#D97E26','#235943','#BA3A2A','#63666A','#A75A10','#191B1F'];
  if(c3) chartInstances.push(new Chart(c3, {
    type:'doughnut',
    data:{labels:Object.keys(porCat), datasets:[{data:Object.values(porCat), backgroundColor:paleta}]},
    options:{plugins:{legend:{position:'bottom', labels:{boxWidth:10, font:{size:10}}}}}
  }));
  const exportInv = $('#btn-export-inv');
  if(exportInv) exportInv.addEventListener('click', ()=>{
    const lotesMapExport = indexarLotesPorProducto();
    const rows = productos.map(p=>Object.assign({}, p, {costoPromedio: Math.round(costoPromedioProducto(p, lotesMapExport))}));
    exportCSV('inventario.csv', rows, ['sku','nombre','variante','categoria','stock','stockMinimo','stockIdeal','precio','costoPromedio','ubicacion']);
  });
  // ventas por método de pago
  const porMetodo = {efectivo:0, debito:0, credito:0, transferencia:0, fiado:0};
  ventas.forEach(v=>{ (v.pagos||[]).forEach(pg=>{ if(porMetodo[pg.metodo]!=null) porMetodo[pg.metodo]+=Number(pg.monto||0); }); });
  const c4 = $('#chart-metodos');
  if(c4) chartInstances.push(new Chart(c4, {
    type:'doughnut',
    data:{labels:['Efectivo','Débito','Crédito','Transferencia','Fiado'], datasets:[{data:[porMetodo.efectivo,porMetodo.debito,porMetodo.credito,porMetodo.transferencia,porMetodo.fiado], backgroundColor:['#235943','#D97E26','#A75A10','#63666A','#BA3A2A']}]},
    options:{plugins:{legend:{position:'bottom', labels:{boxWidth:10, font:{size:10}}}}}
  }));
  const exportMov = $('#btn-export-mov');
  if(exportMov) exportMov.addEventListener('click', ()=>{
    // Con historiales largos, buscar el producto de cada movimiento con .find() es O(movimientos * productos).
    // Se indexa una sola vez por id y la exportación queda en O(movimientos + productos).
    const productosPorId = new Map(productos.map(p=>[p.id, p]));
    const rows = movimientos.map(m=>{
      const p = productosPorId.get(m.productoId);
      return {fecha:new Date(m.fecha).toISOString(), producto:p?p.nombre:'', tipo:m.tipo, cantidad:m.cantidad, motivo:m.motivo||'', operador:m.operador||''};
    });
    exportCSV('movimientos.csv', rows, ['fecha','producto','tipo','cantidad','motivo','operador']);
  });
  const exportClientes = $('#btn-export-clientes');
  if(exportClientes) exportClientes.addEventListener('click', ()=>{
    const rows = clientes.map(c=>({nombre:c.nombre, telefono:c.telefono||'', saldo:Math.round(Number(c.saldo||0)), notas:c.notas||''}));
    exportCSV('clientes-fiado.csv', rows, ['nombre','telefono','saldo','notas']);
  });
  const exportVentasExcel = $('#btn-export-ventas-excel');
  if(exportVentasExcel) exportVentasExcel.addEventListener('click', abrirExportarVentasModal);
}
/* Exportar ventas a Excel, eligiendo cuántos días hacia atrás incluir. Se genera un
   archivo .xls real (tabla HTML con el tipo MIME de Excel) en vez de sumar una librería
   externa: así el botón funciona igual con o sin conexión, como el resto de la app. */
function abrirExportarVentasModal(){
  openModal(`
    <div class="spread"><h3>Exportar ventas a Excel</h3><button class="btn btn-icon btn-ghost" id="m-close" aria-label="Cerrar">${ICONS.close}</button></div>
    <p class="sub">Elige cuántos días hacia atrás quieres incluir en el reporte. Se arma una fila por producto vendido, con su método de pago.</p>
    <label class="field">Días a exportar</label>
    <input class="input" id="exp-dias" type="number" inputmode="numeric" value="30" min="1"/>
    <div class="row wrap" style="margin-top:8px;gap:6px;">
      ${[7,15,30,60,90].map(d=>`<button class="chip" type="button" data-dias-preset="${d}">${d} días</button>`).join('')}
    </div>
    <hr class="hairline"/>
    <button class="btn btn-primary btn-block" id="exp-confirmar" type="button">Generar Excel</button>
  `);
  $('#m-close').addEventListener('click', closeModal);
  $$('[data-dias-preset]').forEach(b=>b.addEventListener('click', ()=>{ $('#exp-dias').value = b.getAttribute('data-dias-preset'); }));
  $('#exp-confirmar').addEventListener('click', ()=>{
    const dias = Math.max(1, Math.round(Number($('#exp-dias').value)) || 30);
    exportarVentasExcel(dias);
    closeModal();
  });
}
function construirFilasExportVentas(dias){
  const desde = Date.now() - dias*24*60*60*1000;
  const filas = [];
  ventas.filter(v=>v.fecha>=desde).slice().sort((a,b)=>a.fecha-b.fecha).forEach(v=>{
    const metodos = (v.pagos&&v.pagos.length) ? v.pagos.map(pg=>metodoLabel(pg.metodo)+': '+fmtCLP(pg.monto)).join(' + ')
      : (v.metodoResumen ? metodoLabel(v.metodoResumen) : '');
    if(v.items && v.items.length){
      v.items.forEach(it=>{
        filas.push({fecha:fmtDate(v.fecha), tipo:v.tipo==='abono'?'Abono':'Venta', cliente:v.cliente||'', operador:v.operador||'',
          producto:it.nombre, cantidad:it.cantidad, precioUnitario:it.precioUnitario, subtotal:it.cantidad*it.precioUnitario,
          totalVenta:v.total, metodos});
      });
    } else {
      filas.push({fecha:fmtDate(v.fecha), tipo:v.tipo==='abono'?'Abono':'Venta', cliente:v.cliente||'', operador:v.operador||'',
        producto:'', cantidad:'', precioUnitario:'', subtotal:'', totalVenta:v.total, metodos});
    }
  });
  return filas;
}
function exportarVentasExcel(dias){
  const filas = construirFilasExportVentas(dias);
  if(!filas.length){ showToast('No hay ventas registradas en los últimos '+dias+' días.', 'error'); return; }
  const cols = [
    ['fecha','Fecha'], ['tipo','Tipo'], ['cliente','Cliente'], ['operador','Vendedor'],
    ['producto','Producto'], ['cantidad','Cantidad'], ['precioUnitario','Precio unitario'],
    ['subtotal','Subtotal'], ['totalVenta','Total venta'], ['metodos','Forma(s) de pago']
  ];
  const celda = (v)=> (v===''||v==null) ? '' : escapeHtml(String(v));
  const thead = '<tr>'+cols.map(c=>`<th style="background:#EAE6DC;font-weight:bold;">${c[1]}</th>`).join('')+'</tr>';
  const tbody = filas.map(f=>'<tr>'+cols.map(c=>`<td>${celda(f[c[0]])}</td>`).join('')+'</tr>').join('');
  const html = `<html><head><meta charset="UTF-8"></head><body><table border="1">${thead}${tbody}</table></body></html>`;
  const blob = new Blob(['\ufeff'+html], {type:'application/vnd.ms-excel;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `ventas_ultimos_${dias}_dias.xls`; a.click();
  URL.revokeObjectURL(url);
  showToast('Reporte generado: '+filas.length+' fila(s).');
}
function exportCSV(filename, rows, cols){
  const header = cols.join(',');
  const body = rows.map(r=>cols.map(c=>{
    let v = r[c]; if(v==null) v='';
    v = String(v).replace(/"/g,'""');
    return /[",\n]/.test(v) ? `"${v}"` : v;
  }).join(',')).join('\n');
  const blob = new Blob([header+'\n'+body], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
}

/* ---------------- INIT ---------------- */
(async function arrancar(){
  try{
    cargarLoginSeguridad();
    (leerJSONLocal('sync_pendientes', []) || []).forEach(k=>{ pendientes[k] = true; });
    await conectarSupabase();
    await validarSesionGuardada();
    await initData();
    if(dbEstado !== 'ok') showToast('Sin conexión a la nube: estás trabajando en este dispositivo. Los cambios se suben solos al reconectar.', 'error');
    else if(listaPendientes().length || colaVentas.length) reintentarSync(true);
  }catch(e){
    console.error('Error al arrancar', e);
    // aunque falle la nube o un CDN, la app tiene que poder abrirse igual
    try{ render(); }catch(_){
      document.getElementById('main').innerHTML = '<div class="section"><div class="empty-state"><div class="big">⚠️</div><p>No se pudo iniciar la aplicación. Revisa tu conexión y vuelve a cargar la página.</p></div></div>';
    }
    showToast('Hubo un problema al iniciar. Revisa la conexión y recarga si algo se ve raro.', 'error');
  }
  // reintenta lo pendiente al recuperar la red y cada 45 segundos
  window.addEventListener('online', ()=>reintentarSync(false));
  setInterval(()=>{ if(navigator.onLine !== false) reintentarSync(true); }, 45000);
})();

})();
